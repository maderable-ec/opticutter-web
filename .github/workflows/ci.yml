name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Vite 8 needs Node 20.19+ / 22.12+.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # `validate` typechecks src/ and e2e/ and lints both; the eslint config runs
      # prettier as a rule, so formatting is covered too.
      - run: npm run validate

      # Vitest: the pure logic (the contracts mirrored with the backend and friends).
      - run: npm test

      - run: npm run build

  # The flows, in a real browser against the dev server with the API simulated
  # (e2e/fixtures/api.ts): no backend. Chromium only; the iPad's WebKit runs locally.
  # build-push waits on the whole `ci` workflow, so a red e2e also holds the image.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test --project=desktop --project=phone --project=taller-infinix

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
